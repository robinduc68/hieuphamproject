# Giữ scheme gốc do nginx VPS gửi xuống. Nginx trong container listen port 80
# nên $scheme luôn = http; ghi đè thẳng sẽ làm backend sinh redirect http://
# trong khi trang chạy https:// -> trình duyệt chặn mixed content.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS – resolve backend at request time so nginx can start
    # before the API container is up (avoids "host not found in upstream").
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Proxy /api → FastAPI backend
    location ^~ /api/ {
        set $api_upstream backend:8000;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # Proxy /media → backend static files
    location ^~ /media/ {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
    }

    # Vue SPA – fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
