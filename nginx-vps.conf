# Nginx config chạy trên VPS HOST (không phải trong Docker)
# Đặt ở: /etc/nginx/sites-available/hahoatsilk
# Sau đó: ln -s /etc/nginx/sites-available/hahoatsilk /etc/nginx/sites-enabled/

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name hahoatsilk.com www.hahoatsilk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main site (hahoatsilk.com) ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name hahoatsilk.com www.hahoatsilk.com;

    # SSL – Certbot sẽ tự điền sau khi chạy certbot
    ssl_certificate     /etc/letsencrypt/live/hahoatsilk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hahoatsilk.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # Proxy tất cả về frontend container (Nginx trong Docker xử lý /api luôn)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Admin panel (admin.hahoatsilk.com) ────────────────────────────────────
server {
    listen 80;
    server_name admin.hahoatsilk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.hahoatsilk.com;

    ssl_certificate     /etc/letsencrypt/live/hahoatsilk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hahoatsilk.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
